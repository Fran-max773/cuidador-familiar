name: Keep Supabase project alive

# Supabase pausa los proyectos gratuitos que no tienen "actividad suficiente" en 7 días.
# - Tocar /auth/v1/health o /rest/v1/ sin clave NO cuenta (el proyecto se pausó el 2026-09-25).
# - 1 lectura diaria de 1 tabla TAMPOCO bastó: el 2026-10-11 llegó otro aviso de pausa pese a
#   15 días seguidos de consultas correctas. Desde el 2026-10-13: 4 veces al día y las 5 tablas.

on:
  schedule:
    # 4 veces al día (UTC): 00:17, 06:17, 12:17, 18:17
    - cron: "17 0,6,12,18 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultas reales a la base de datos (5 tablas, clave pública)
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          fallos=0
          for t in grupos miembros tareas medicaciones citas; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --retry 3 --retry-delay 20 \
              "https://geqxighknaxsastdqepk.supabase.co/rest/v1/$t?select=*&limit=5" \
              -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY")
            echo "$t: $code"
            [ "$code" = "200" ] || fallos=$((fallos+1))
          done
          if [ "$fallos" -gt 0 ]; then
            echo "::error::Supabase no responde bien ($fallos tablas con error). Si el proyecto está pausado, reactívalo en https://supabase.com/dashboard/project/geqxighknaxsastdqepk (botón 'Resume project', en español 'Proyecto de currículum')."
            exit 1
          fi
